include:
  - path: project.local.yml
    enable: ${INCLUDE_PROJECT_LOCAL_YAML}

name: Vini
options:
  minimumXcodeGenVersion: 2.44.1
  deploymentTarget:
    macOS: 14.0
  fileTypes:
    icon:
      file: true
packages:
  swift-sdk:
    url: https://github.com/modelcontextprotocol/swift-sdk.git
    from: 0.11.0
settings:
  base:
    SWIFT_VERSION: 6.0
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.1.0
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      ENABLE_TESTABILITY: YES
      SWIFT_OPTIMIZATION_LEVEL: -Onone
      ONLY_ACTIVE_ARCH: YES
targets:
  Vini:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Vini
        excludes:
          - AGENTS.md
          - "**/AGENTS.md"
          - Generated-Info.plist
      - path: AppIcon.icon
        buildPhase: resources
        group: Vini
    dependencies:
      - target: ViniMCP
      - package: swift-sdk
        product: MCP
    preBuildScripts:
      - name: Validate bundle identifier
        script: |
          if [ "$PRODUCT_BUNDLE_IDENTIFIER" != "com.ntoporcov.vini" ]; then
            echo "error: Unexpected bundle identifier '$PRODUCT_BUNDLE_IDENTIFIER'. Regenerate the project from project.yml before building."
            exit 1
          fi
    postBuildScripts:
      - name: Embed ViniMCP helper
        script: |
          set -euo pipefail
          helper_dir="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          mkdir -p "$helper_dir"
          cp "$BUILT_PRODUCTS_DIR/ViniMCP" "$helper_dir/ViniMCP"
          chmod 755 "$helper_dir/ViniMCP"
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/ViniMCP
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/ViniMCP
    info:
      path: Vini/Generated-Info.plist
      properties:
        CFBundleDisplayName: Vini
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: "Copyright © 2026 Nicolas Toporcov. All rights reserved."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ntoporcov.vini
        PRODUCT_NAME: Vini
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Vini/Vini.entitlements
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
    scheme:
      gatherCoverageData: false
      testTargets:
        - ViniTests
  ViniMCP:
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: ViniMCP
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ntoporcov.vini.mcp
        PRODUCT_NAME: ViniMCP
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
  ViniTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    hostApplication: Vini
    sources:
      - path: ViniTests
        excludes:
          - AGENTS.md
          - "**/AGENTS.md"
    dependencies:
      - target: Vini
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.ntoporcov.vini.tests
        CODE_SIGN_STYLE: Automatic
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Vini.app/Contents/MacOS/Vini"
        BUNDLE_LOADER: "$(TEST_HOST)"
